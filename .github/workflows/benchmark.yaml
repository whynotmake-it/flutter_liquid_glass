name: Performance Benchmarks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/liquid_glass_renderer/**'

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Enable macOS desktop support
        run: |
          flutter config --enable-macos-desktop
          flutter config --no-enable-swift-package-manager

      - name: 🔧 Get dependencies
        working-directory: packages/liquid_glass_renderer/example
        run: flutter pub get

      - name: Verify Flutter GPU capability fallback
        working-directory: packages/liquid_glass_renderer
        run: >-
          flutter test --enable-impeller
          --dart-define=EXPECT_FLUTTER_GPU_FALLBACK=true
          test/src/flutter_gpu_fallback_test.dart

      - name: 🏃‍♂️ Run benchmark tests
        working-directory: packages/liquid_glass_renderer/example
        env:
          LIQUID_GLASS_BENCHMARK_ENFORCE: 'true'
        run: |
          chmod +x tool/benchmark.sh
          ./tool/benchmark.sh

      - name: 📊 Parse benchmark results
        id: parse-results
        working-directory: packages/liquid_glass_renderer/example
        run: |
          dart run tool/parse_benchmark_results.dart \
            --input build/benchmark \
            --markdown build/benchmark/summary.md \
            --json build/benchmark/summary.json \
            --minimum-repetitions 3 \
            --enforce true

      - name: 📝 Find existing comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Performance Benchmark Results'

      - name: 💬 Create or update PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.parse-results.outputs.summary }}
          edit-mode: replace

      - name: 📤 Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            packages/liquid_glass_renderer/example/build/benchmark/
          retention-days: 30
