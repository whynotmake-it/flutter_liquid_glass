name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

jobs:
  semantic_pull_request:
    name: Check PR Title
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  flutter-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      
      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🧪 Run Analyze
        run: melos run analyze

      - name: 📝 Run Tests without goldens
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'goldens')
        run: melos run test-without-goldens


  matte_order_validator:
    name: Matte-Order Validator
    # The validator test rasterizes the real glass shader and captures it, so
    # it runs on the macOS image that supports Impeller shader filters rather
    # than the Linux test job.
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: 🔧 Get dependencies
        working-directory: packages/liquid_glass_renderer/example
        run: flutter pub get

      - name: 🩷 Run matte-order validator test
        working-directory: packages/liquid_glass_renderer/example
        run: >-
          flutter test --enable-impeller --enable-flutter-gpu
          --dart-define=LIQUID_GLASS_VALIDATE_MATTE_ORDER=true
          test/matte_order_validation_test.dart


  skia_build:
    name: Skia Build Check
    # Web is a Skia-only target: its build fails if a pubspec shader cannot
    # compile to SkSL, so this guards the Skia compile path for consumers.
    # The liquid glass shaders are bundled by the build hook as .iplr instead.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🌐 Build example for web
        working-directory: packages/liquid_glass_renderer/example
        run: |
          flutter create --platforms web .
          flutter build web

  check_generation:
    name: Check Code Generation
    timeout-minutes: 10
    runs-on: macos-26
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🔨 Generate
        run: melos run generate

      - name: 🔎 Check there are no uncommitted changes
        run: |
          git add .
          git diff --cached --exit-code -- . \
            ':!**/GeneratedPluginRegistrant.swift'

  golden_tests:
    name: Run Golden Tests
    # Only run on main or if PR is labeled with "goldens"
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'goldens')
    # The macOS goldens are rendered with `flutter test --update-goldens` on
    # this image; regenerate them on the same macOS version when it changes.
    runs-on: macos-26
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 📝 Run Test
        run: melos run coverage

      - name: 📊 Generate Coverage
        id: coverage-report
        uses: whynotmake-it/dart-coverage-assistant@v1.1
        with:
          generate_badges: pr