name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

jobs:
  semantic_pull_request:
    name: Check PR Title
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  flutter-check:
    name: Build Check
    runs-on: ubuntu-latest
    # With the widget packages the tests alone take about 18 minutes, and
    # analysis and setup another 2; Latest Flutter runs the same tests in 30.
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      
      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🧪 Run Analyze
        run: melos run analyze

      - name: 🔧 Check dart fix data
        run: melos run fix-data

      - name: 📝 Run Tests without goldens
        run: melos run test-without-goldens


  oldest_flutter:
    name: Oldest Flutter
    # The pubspecs take Flutter 3.47.0 and up, so the tests also run on the
    # newest 3.47 release: code that needs a newer Flutter fails here before
    # a user on 3.47 meets it. Move it with the pubspecs' lower bound.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 📝 Run Tests without goldens
        run: melos run test-without-goldens

  latest_flutter:
    name: Latest Flutter
    # The tests also run on the newest stable release: a release that breaks
    # them shows here before a user of it meets it. Analysis stays on the
    # version .fvmrc pins, where a new release's deprecations are not yet
    # reported.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 📝 Run Tests without goldens
        run: melos run test-without-goldens

  skia_build:
    name: Skia Build Check
    # Web is a Skia-only target: its build fails if a pubspec shader cannot
    # compile to SkSL, so this guards the Skia compile path for consumers.
    # The liquid glass shaders are bundled by the build hook as .iplr instead.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🌐 Build example for web
        working-directory: packages/liquid_glass_renderer/example
        run: |
          flutter create --platforms web .
          flutter build web


  check_generation:
    name: Check Code Generation
    timeout-minutes: 10
    runs-on: xcode-27
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🔨 Generate
        run: melos run generate

      - name: 🔎 Check there are no uncommitted changes
        run: |
          git add .
          git diff --cached --exit-code -- . \
            ':!**/GeneratedPluginRegistrant.swift'

  golden_tests:
    name: Run Golden Tests
    # Only run on main or if PR is labeled with "goldens"
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'goldens')
    # The macOS goldens are rendered with `flutter test --update-goldens` on
    # macOS 27.2.1 (26B131). This image still runs macOS 27.0.1 (26A434),
    # which draws the same pixels.
    runs-on: xcode-27
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 📝 Run Test
        run: melos run coverage

      - name: 📊 Generate Coverage
        id: coverage-report
        uses: whynotmake-it/dart-coverage-assistant@v1.1
        with:
          # A fork's token cannot push the badge branch or open its pull request.
          generate_badges: ${{ github.repository == 'whynotmake-it/flutter_liquid_glass' && 'pr' || 'false' }}