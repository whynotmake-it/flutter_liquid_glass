name: Regenerate Goldens

# Golden references are rendered by `flutter test --update-goldens` on the same
# macOS/Xcode image the CI golden job runs on, so they live on one specific
# image (`xcode-27` = macOS 27, arm64). VM GPU output differs from local
# hardware, so always regenerate here instead of committing locally produced
# images.
#
# Dispatch it on the branch whose references you want to refresh:
#
#   gh workflow run update-goldens.yaml --ref <branch>
#
# It commits any updated reference images back to that branch using the default
# GITHUB_TOKEN. It never runs on push or pull_request.
#
# NOTE: GitHub only exposes `workflow_dispatch` for workflows that exist on the
# default branch, so this file can only be dispatched directly once it is on
# `main`. Until then (e.g. to refresh references in the PR that introduces the
# macOS 27 runner), dispatch it through `benchmark.yaml`, which is already
# manual-dispatchable:
#
#   gh workflow run benchmark.yaml --ref <branch> -f task=goldens
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  update-goldens:
    name: Regenerate Goldens
    # Must be the same image as the `golden_tests` job in main.yaml.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4
        with:
          # The branch the workflow was dispatched on.
          ref: ${{ github.ref_name }}
          lfs: true
          fetch-depth: 0

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🖼️ Regenerate goldens
        run: melos run update-goldens

      - name: 💾 Commit updated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Goldens already up to date on xcode-27; nothing to commit."
            exit 0
          fi
          git commit -m "test: regenerate goldens on xcode-27 runner"
          git push origin HEAD:${{ github.ref_name }}
