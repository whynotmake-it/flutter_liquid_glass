analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Its own package; analyze it from tool/apple_match/flutter.
    - tool/apple_match/flutter/**
include: ../analysis_options.yaml

# No Public Member API Docs
linter:
  rules:
    public_member_api_docs: false
