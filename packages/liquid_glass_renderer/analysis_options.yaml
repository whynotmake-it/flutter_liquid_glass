include: package:lintervention/analysis_options.yaml

analyzer:
  errors:
    # Generated by hook/build.dart into a gitignored build/ directory.
    asset_directory_does_not_exist: ignore
  exclude:
    - build/**
    # Old API on purpose: dart fix rewrites it, see lib/fix_data.yaml.
    - test_fixes/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
