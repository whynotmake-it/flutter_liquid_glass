name: liquid_glass_renderer
description: An iOS 27-style liquid glass renderer for Flutter.
version: 0.3.0-dev.1

homepage: https://whynotmake.it
repository: https://github.com/whynotmake-it/flutter_liquid_glass/tree/main/packages/liquid_glass_renderer
screenshots:
  - description: "A title image with three liquid glass elements"
    path: doc/screenshot.png

topics:
  - liquid-glass
  - apple
  - shaders
  - flutter
  - effects

environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: ">=3.47.0"

# We only support Platforms that support Impeller.
platforms:
  macos:
  ios:
  android:

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  flutter_shaders: ^0.1.3
  hooks: ^2.0.2
  logging: ^1.3.0
  meta: ^1.16.0
  motor: ^1.0.1

dev_dependencies:
  alchemist: ^0.12.1
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1
  mocktail: ^1.0.3
  snaptest: ^0.2.3

flutter:
  uses-material-design: true
  shaders:
    - lib/assets/shaders/liquid_glass_final_render.frag
    - lib/assets/shaders/liquid_glass_final_render_material.frag
    - lib/assets/shaders/fake_glass_surface.frag
  assets:
    - build/shaderbundles/
